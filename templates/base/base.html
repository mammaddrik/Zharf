{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Zharf{% endblock %}</title>

    {% block styles %}
        <link rel="stylesheet" href="{% static 'css/base/reset.css' %}">
        <link rel="stylesheet" href="{% static 'css/base/variables.css' %}">
        <link rel="stylesheet" href="{% static 'css/base/global.css' %}">
        <link rel="stylesheet" href="{% static 'css/vendor/bootstrap-icons.css' %}">
        <link rel="stylesheet" href="{% static 'css/pages/landing.css' %}">
        <link rel="stylesheet" href="{% static 'css/components/back-to-top.css' %}">
    {% endblock %}
</head>
<body>
    {% block content %}
    {% endblock %}

    {% include 'components/back_to_top.html' %}

    {% block scripts %}
        <script src="{% static 'js/core/motion.js' %}"></script>
        <script src="{% static 'js/landing/entrance.js' %}"></script>
        <script src="{% static 'js/landing/reveal.js' %}"></script>
        <script src="{% static 'js/landing/ambient.js' %}"></script>
        <script src="{% static 'js/landing/parallax.js' %}"></script>
        <script src="{% static 'js/main.js' %}"></script>
        <script src="{% static 'js/components/back-to-top.js' %}"></script>
    {% endblock %}
</body>
</html>
