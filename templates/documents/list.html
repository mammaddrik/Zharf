{% extends 'base/base.html' %}

{% block title %}
    Documents | Zharf
{% endblock %}

{% block content %}

    <main>
        <h1>Documents</h1>

        {% for document in documents %}
            <article>
                <a href="{% url 'documents:document_detail' document.pk %}">
                    {{ document.title }}
                </a>
            </article>
        {% empty %}
            <p>No documents found.</p>
        {% endfor %}
    </main>

{% endblock %}
