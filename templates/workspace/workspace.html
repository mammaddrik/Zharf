{% extends 'base/base.html' %}

{% load static %}

{% block title %}
    Workspace | Zharf
{% endblock %}

{% block styles %}
    <link rel="stylesheet" href="{% static 'css/pages/workspace.css' %}">
{% endblock %}

{% block content %}

    <div class="workspace">

        <div class="workspace-mobile-header">

            <button
                type="button"
                class="workspace-mobile-menu"
                aria-label="Open sidebar"
            >
                <i class="bi bi-list" aria-hidden="true"></i>
            </button>

        </div>

        <div class="workspace-sidebar-overlay"></div>

        {% include 'workspace/components/sidebar.html' %}

        <main class="workspace-main">
        </main>

    </div>

{% endblock %}

{% block scripts %}
    <script src="{% static 'js/workspace/sidebar.js' %}"></script>
{% endblock %}
