<div class="form-field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ field.label }}
    </label>

    {{ field }}

    {% if field.help_text %}
        <p class="form-help">{{ field.help_text }}</p>
    {% endif %}

    {% for error in field.errors %}
        <p class="form-error">{{ error }}</p>
    {% endfor %}
</div>
