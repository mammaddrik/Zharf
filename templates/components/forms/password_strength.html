<div class="password-strength" data-password-strength>
    <div class="password-strength-header">
        <span>Password strength</span>
        <span class="password-strength-label" data-password-strength-label></span>
    </div>

    <div class="password-strength-bar" aria-hidden="true">
        <span class="password-strength-fill" data-password-strength-fill></span>
    </div>

    <div class="password-strength-requirements">
        <div class="password-strength-requirement" data-requirement="length">
            <i class="bi bi-circle" aria-hidden="true"></i>
            <span>At least 8 characters</span>
        </div>

        <div class="password-strength-requirement" data-requirement="lowercase">
            <i class="bi bi-circle" aria-hidden="true"></i>
            <span>Contains a lowercase letter</span>
        </div>

        <div class="password-strength-requirement" data-requirement="uppercase">
            <i class="bi bi-circle" aria-hidden="true"></i>
            <span>Contains an uppercase letter</span>
        </div>

        <div class="password-strength-requirement" data-requirement="number">
            <i class="bi bi-circle" aria-hidden="true"></i>
            <span>Contains a number</span>
        </div>

        <div class="password-strength-requirement" data-requirement="special">
            <i class="bi bi-circle" aria-hidden="true"></i>
            <span>Contains a special character</span>
        </div>
    </div>
</div>
